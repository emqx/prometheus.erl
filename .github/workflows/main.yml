---
name: ci

on: [pull_request]

jobs:
  run_checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        erlang:
          - otp: "27"
            rebar3: "3.24"
          - otp: "28"
            rebar3: "3.25"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.erlang.otp}}
          rebar3-version: ${{matrix.erlang.rebar3}}
      - name: Run checks
        run: rebar3 do xref, dialyzer, eunit
