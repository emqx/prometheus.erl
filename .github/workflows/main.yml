---
name: ci

on: [push, pull_request]

jobs:
  run_checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp:
          - 27
          - 28
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: 3.22.0
      - name: Run checks
        run: rebar3 do xref, dialyzer, eunit
